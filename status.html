<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ตรวจสอบสถานะการชำระเงิน - RTI Wood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@400;600;800&family=Prompt:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-forest: #1b4332;
            --secondary-green: #2d6a4f;
            --accent-wood: #a98467;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-nature: #f8f9fa;
        }

        body {
            font-family: 'Prompt', 'Inter', sans-serif;
            background-color: var(--bg-nature);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .brand-font {
            font-family: 'Outfit', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .search-input:focus {
            box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.1);
            border-color: var(--secondary-green);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-pending {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .status-paid {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-press:active {
            transform: scale(0.97);
        }

        .image-aspect {
            aspect-ratio: 4/3;
            width: 100%;
            object-fit: cover;
        }

        /* Mobile specific adjustments */
        @media (max-width: 640px) {
            .container-padding {
                padding: 1rem;
            }

            .header-icon {
                font-size: 2.5rem;
            }

            .title-text {
                font-size: 1.75rem;
            }

            .result-card {
                padding: 1.25rem;
            }
        }
    </style>
</head>

<body class="container-padding py-8 md:py-12">
    <div class="max-w-xl mx-auto w-full">
        <!-- Header -->
        <header class="text-center mb-8 fade-in">
            <div class="inline-flex p-5 rounded-[2rem] bg-white shadow-xl mb-4 border border-green-50">
                <span class="header-icon text-5xl">🪵</span>
            </div>
            <h1 class="title-text text-3xl font-extrabold brand-font text-gray-800 mb-2">
                RTI <span class="text-[#2d6a4f]">Wood</span> Tracking
            </h1>
            <p class="text-gray-500 font-medium text-sm">ตรวจสอบสถานะและหลักฐานการโอนเงิน</p>
        </header>

        <!-- Search Box -->
        <div class="glass-card rounded-[2rem] p-5 md:p-8 mb-6 fade-in" style="animation-delay: 0.1s;">
            <label class="block mb-3 text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] ml-1">
                ระบุรหัสบิล (Tracking ID)
            </label>
            <div class="flex flex-col gap-3">
                <input type="text" id="tracking-id" placeholder="ตัวอย่าง: R1234"
                    class="w-full px-5 py-4 rounded-2xl border-2 border-gray-100 search-input outline-none transition-all text-lg font-bold tracking-wider uppercase bg-white">
                <button id="search-btn"
                    class="btn-press w-full bg-[#1b4332] text-white py-4 rounded-2xl font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-green-900/10">
                    <span id="btn-text" class="tracking-wide">ตรวจสอบสถานะ</span>
                    <div id="btn-spinner" class="spinner hidden"></div>
                </button>
            </div>
            <div class="mt-4 flex items-center gap-2 text-gray-400 px-1">
                <div class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></div>
                <p class="text-[11px] leading-tight">ข้อมูลเชื่อมต่อกับระบบหลังบ้านแบบ Real-time</p>
            </div>
        </div>

        <!-- Result Section -->
        <div id="result-container" class="hidden space-y-4 fade-in" style="animation-delay: 0.2s;">
            <!-- Result Card will be injected here -->
        </div>

        <!-- No Result Case -->
        <div id="not-found" class="hidden text-center py-16 fade-in">
            <div class="text-5xl mb-4 grayscale opacity-50">🔍</div>
            <h3 class="text-lg font-bold text-gray-700 mb-1">ไม่พบรหัสบิลนี้</h3>
            <p class="text-sm text-gray-400 max-w-[250px] mx-auto">รหัสอาจยังไม่เข้าระบบ หรือมีความผิดพลาด
                กรุณาตรวจสอบอีกครั้ง</p>
        </div>

        <footer class="mt-12 text-center">
            <p class="text-[10px] text-gray-300 uppercase tracking-widest font-bold">
                © 2026 RTI Wood Industry. All Rights Reserved.
            </p>
        </footer>
    </div>

    <!-- Image Modal Viewer -->
    <div id="image-modal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/95 p-4 transition-all overflow-hidden">
        <button id="close-modal"
            class="absolute top-8 right-8 text-white/50 text-5xl font-light hover:text-white transition-colors">&times;</button>
        <div class="w-full max-w-4xl max-h-[85vh] flex items-center justify-center">
            <img id="modal-img" src="" alt="Full View"
                class="max-w-full max-h-full rounded-xl shadow-2xl object-contain">
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yahrmtzioddmmccllpfs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BqALINfN4CbY-Utg5rYArA_Tb5tItSh';
        const TABLE = 'wood_records';

        const searchBtn = document.getElementById('search-btn');
        const inputField = document.getElementById('tracking-id');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const resultContainer = document.getElementById('result-container');
        const notFound = document.getElementById('not-found');

        searchBtn.addEventListener('click', performSearch);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
                inputField.blur();
            }
        });

        async function performSearch() {
            const id = inputField.value.trim().toUpperCase();
            if (!id) return;

            // Loading state
            searchBtn.disabled = true;
            btnText.classList.add('opacity-0');
            btnSpinner.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            notFound.classList.add('hidden');

            try {
                const searchId = id;
                const cleanId = searchId.replace(/^R/, '');
                
                // ค้นหาใน Supabase แบบยืดหยุ่น: รองรับ id, cleanId, และ R + cleanId แบบไม่สนใจพิมพ์เล็ก-ใหญ่ (ilike)
                const queryUrl = `${SUPABASE_URL}/rest/v1/${TABLE}?or=(bill_id.ilike.${encodeURIComponent(searchId)},bill_id.ilike.${encodeURIComponent(cleanId)},bill_id.ilike.${encodeURIComponent('R' + cleanId)})&limit=1`;
                
                const response = await fetch(queryUrl, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const data = await response.json();
                const record = data[0];

                if (record) {
                    renderResult(record);
                } else {
                    notFound.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('การเชื่อมต่อขัดข้อง กรุณาลองใหม่อีกครั้ง');
            } finally {
                searchBtn.disabled = false;
                btnText.classList.remove('opacity-0');
                btnSpinner.classList.add('hidden');
            }
        }

        function getDirectImageUrl(url) {
            if (!url) return '';
            if (url.startsWith('data:') || !url.includes('drive.google.com')) return url;
            const match = url.match(/[-\w]{25,}/);
            if (match && match[0]) return `https://lh3.googleusercontent.com/d/${match[0]}`;
            return url;
        }

        function parseBulkPayNote(note) {
            if (!note) return null;
            
            const isBulk = note.includes('ยอดโอนก้อน') || note.includes('รายละเอียดบิลที่จ่ายร่วมกัน') || note.includes('จ่ายรวมในยอดโอนก้อน');
            if (!isBulk) return null;
            
            const result = {
                isPartial: note.includes('หักจ่ายบางส่วน') || note.includes('คงเหลือ'),
                originalAmount: null,
                paidAmount: null,
                remainingAmount: null,
                bulkTotal: null,
                bills: [],
                plainNote: ''
            };
            
            if (result.isPartial) {
                const origMatch = note.match(/ยอดเดิม\s*([\d,.]+)\s*บาท/);
                const paidMatch = note.match(/หักจ่ายบางส่วน\s*([\d,.]+)\s*บาท/);
                const remainMatch = note.match(/คงเหลือ\s*([\d,.]+)\s*บาท/);
                
                if (origMatch) result.originalAmount = origMatch[1];
                if (paidMatch) result.paidAmount = paidMatch[1];
                if (remainMatch) result.remainingAmount = remainMatch[1];
            }
            
            const bulkMatch = note.match(/ยอดโอนก้อน\s*([\d,.]+)\s*บาท/);
            if (bulkMatch) {
                result.bulkTotal = bulkMatch[1];
            }
            
            const matches = [...note.matchAll(/([A-Z0-9_-]+)\s*\(([\d,.]+)\s*บาท\)/gi)];
            matches.forEach(m => {
                result.bills.push({
                    id: m[1],
                    amount: m[2]
                });
            });

            const splitIndex = note.indexOf('จ่ายรวมในยอดโอนก้อน');
            if (splitIndex !== -1) {
                result.plainNote = note.substring(0, splitIndex).replace(/\s*\|\s*$/, '').trim();
            } else {
                const parenIndex = note.indexOf('(จ่ายรวมในยอดโอนก้อน');
                if (parenIndex !== -1) {
                    result.plainNote = note.substring(0, parenIndex).replace(/\s*\|\s*$/, '').trim();
                } else {
                    result.plainNote = note;
                }
            }
            
            return result;
        }

        function renderNoteSection(record) {
            if (!record.note) return '';
            
            const parsed = parseBulkPayNote(record.note);
            if (!parsed) {
                return `
                    <div class="mb-6 bg-amber-50/70 border border-amber-100/70 rounded-2xl p-4">
                        <div class="text-[10px] text-amber-800 font-bold uppercase tracking-wider mb-1 flex items-center gap-1.5">
                            <span>📝 หมายเหตุ / รายละเอียดการโอน</span>
                        </div>
                        <div class="text-xs text-gray-700 font-medium whitespace-pre-line leading-relaxed">${record.note}</div>
                    </div>
                `;
            }
            
            let html = '';
            if (parsed.plainNote) {
                html += `
                    <div class="mb-4 bg-amber-50/70 border border-amber-100/70 rounded-2xl p-4">
                        <div class="text-[10px] text-amber-800 font-bold uppercase tracking-wider mb-1">📝 หมายเหตุเพิ่มเติม</div>
                        <div class="text-xs text-gray-700 font-medium whitespace-pre-line leading-relaxed">${parsed.plainNote}</div>
                    </div>
                `;
            }
            
            html += `
                <div class="mb-6 bg-emerald-50/60 border border-emerald-100 rounded-2xl p-5 shadow-sm">
                    <div class="text-xs font-bold text-emerald-800 mb-3.5 flex items-center gap-2">
                        <span>💰 รายละเอียดการโอนเงินก้อน (Bulk Payment)</span>
                    </div>
            `;
            
            if (parsed.isPartial) {
                html += `
                    <div class="grid grid-cols-3 gap-2 mb-4 bg-white p-3 rounded-2xl border border-emerald-100/50 text-center shadow-sm">
                        <div>
                            <div class="text-[9px] text-gray-400 font-bold uppercase mb-0.5">ยอดบิลเดิม</div>
                            <div class="text-xs font-bold text-gray-700">${parsed.originalAmount} ฿</div>
                        </div>
                        <div class="border-x border-gray-100">
                            <div class="text-[9px] text-gray-400 font-bold uppercase mb-0.5">หักจ่ายรอบนี้</div>
                            <div class="text-xs font-bold text-emerald-600">${parsed.paidAmount} ฿</div>
                        </div>
                        <div>
                            <div class="text-[9px] text-gray-400 font-bold uppercase mb-0.5">คงเหลือค้าง</div>
                            <div class="text-xs font-bold text-amber-600">${parsed.remainingAmount} ฿</div>
                        </div>
                    </div>
                `;
            }
            
            html += `
                <div class="text-xs text-emerald-800 font-semibold mb-3 flex justify-between items-center bg-emerald-100/40 px-3 py-2 rounded-xl">
                    <span>ยอดเงินโอนเข้าบัญชีรวม:</span>
                    <span class="font-extrabold text-sm text-emerald-900">${parsed.bulkTotal} บาท</span>
                </div>
            `;
            
            if (parsed.bills && parsed.bills.length > 0) {
                html += `
                    <div class="bg-white rounded-xl border border-emerald-100 overflow-hidden shadow-sm">
                        <div class="text-[9px] text-emerald-800/60 font-bold uppercase px-3 py-2 bg-emerald-50/40 border-b border-emerald-100/50">
                            บิลที่ชำระเงินร่วมกันในสลิปนี้
                        </div>
                        <div class="divide-y divide-gray-50">
                `;
                
                parsed.bills.forEach(b => {
                    const isCurrent = b.id.toLowerCase() === record.bill_id.toLowerCase();
                    html += `
                        <div class="flex justify-between items-center px-3 py-2.5 text-xs ${isCurrent ? 'bg-emerald-50/40' : ''}">
                            <span class="font-mono font-bold ${isCurrent ? 'text-emerald-700 underline' : 'text-gray-500'}">
                                📄 ${b.id} ${isCurrent ? ' (บิลใบนี้)' : ''}
                            </span>
                            <span class="font-bold ${isCurrent ? 'text-emerald-700 text-sm' : 'text-gray-700'}">${b.amount} ฿</span>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            html += `</div>`;
            return html;
        }

        function renderResult(record) {
            const amount = parseFloat(record.amount || 0).toLocaleString('th-TH', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            const isPaid = record.status === 'จ่ายแล้ว';
            const statusClass = isPaid ? 'status-paid' : 'status-pending';

            const createdDate = record.created_at ? new Date(record.created_at).toLocaleDateString('th-TH', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            }) : '-';

            const paidDate = record.paid_at ? new Date(record.paid_at).toLocaleDateString('th-TH', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            }) : 'รอดำเนินการ';

            const slipUrl = getDirectImageUrl(record.slip_url);
            const receiptUrl = getDirectImageUrl(record.receipt_url);

            const woodWeight = record.wood_weight ? parseFloat(record.wood_weight).toLocaleString('th-TH') + ' กก.' : '-';
            const weighFee = record.weigh_fee ? parseFloat(record.weigh_fee).toLocaleString('th-TH', { minimumFractionDigits: 2 }) + ' ฿' : '-';
            const woodPrice = record.wood_price_per_kg ? parseFloat(record.wood_price_per_kg).toLocaleString('th-TH', { minimumFractionDigits: 2 }) + ' ฿' : '-';

            resultContainer.innerHTML = `
                <div class="result-card glass-card rounded-[2rem] p-6 relative overflow-hidden border-t-8 border-[#1b4332]">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="status-badge ${statusClass}">${record.status}</span>
                            <h2 class="text-2xl font-extrabold text-gray-800 mt-3 break-words">${record.bill_name}</h2>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-gray-50/50 p-3 rounded-2xl border border-gray-100">
                            <div class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">รหัสบิล</div>
                            <div class="text-sm font-bold text-gray-700">${record.bill_id}</div>
                        </div>
                        <div class="bg-gray-50/50 p-3 rounded-2xl border border-gray-100">
                            <div class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">ทะเบียนรถ</div>
                            <div class="text-sm font-bold text-gray-700">${record.license_plate}</div>
                        </div>
                    </div>

                    <!-- Wood Info Grid -->
                    <div class="grid grid-cols-3 gap-2 mb-6">
                        <div class="text-center p-2">
                            <div class="text-[8px] text-gray-400 font-bold uppercase mb-1">น้ำหนัก</div>
                            <div class="text-xs font-bold text-gray-600">${woodWeight}</div>
                        </div>
                        <div class="text-center p-2 border-x border-gray-100">
                            <div class="text-[8px] text-gray-400 font-bold uppercase mb-1">ราคา/กก.</div>
                            <div class="text-xs font-bold text-gray-600">${woodPrice}</div>
                        </div>
                        <div class="text-center p-2">
                            <div class="text-[8px] text-gray-400 font-bold uppercase mb-1">ค่าชั่ง</div>
                            <div class="text-xs font-bold text-gray-600">${weighFee}</div>
                        </div>
                    </div>

                    <!-- Pricing Breakdown (if has weigh fee or deduction) -->
                    ${(record.weigh_fee && parseFloat(record.weigh_fee) > 0) || (record.deduction_other && parseFloat(record.deduction_other) > 0) ? `
                    <div class="bg-gray-50/50 p-4 rounded-2xl border border-gray-100 mb-6 space-y-2 text-xs">
                        ${record.wood_weight && record.wood_price_per_kg ? `
                        <div class="flex justify-between items-center text-gray-600">
                            <span>คำนวณเบื้องต้น:</span>
                            <span class="font-semibold text-gray-700">${(parseFloat(record.wood_weight) * parseFloat(record.wood_price_per_kg)).toLocaleString('th-TH', { minimumFractionDigits: 2 })} ฿</span>
                        </div>
                        ` : ''}
                        ${record.weigh_fee && parseFloat(record.weigh_fee) > 0 ? `
                        <div class="flex justify-between items-center text-gray-600">
                            <span>หักค่าชั่งรถ:</span>
                            <span class="font-semibold text-red-500">-${parseFloat(record.weigh_fee).toLocaleString('th-TH', { minimumFractionDigits: 2 })} ฿</span>
                        </div>
                        ` : ''}
                        ${record.deduction_other && parseFloat(record.deduction_other) > 0 ? `
                        <div class="flex justify-between items-center text-rose-600 font-semibold">
                            <span>หักอื่นๆ (${record.deduction_reason || 'ไม่ได้ระบุสาเหตุ'}):</span>
                            <span class="font-semibold">-${parseFloat(record.deduction_other).toLocaleString('th-TH', { minimumFractionDigits: 2 })} ฿</span>
                        </div>
                        ` : ''}
                    </div>
                    ` : ''}

                    <!-- Payment Highlighting -->
                    <div class="bg-[#1b4332] p-5 rounded-[1.5rem] text-white shadow-xl shadow-green-950/10 mb-6 relative overflow-hidden">
                        <div class="absolute -right-4 -bottom-4 opacity-10 text-6xl">💸</div>
                        <div class="text-[10px] opacity-70 font-bold uppercase tracking-[0.15em] mb-1">ยอดรวมสุทธิ</div>
                        <div class="text-3xl font-black">${amount} <span class="text-sm font-light opacity-80 uppercase ml-1">THB</span></div>
                    </div>

                    <div class="space-y-3 mb-8">
                        <div class="flex justify-between items-center px-2">
                            <span class="text-[11px] text-gray-400 font-medium">วันที่ลงรายการ</span>
                            <span class="text-[11px] text-gray-600 font-bold">${createdDate}</span>
                        </div>
                        <div class="flex justify-between items-center px-2 py-2 bg-gray-50 rounded-xl">
                            <span class="text-[11px] text-gray-400 font-medium">${isPaid ? 'จ่ายเงินเมื่อ' : 'สถานะการจ่าย'}</span>
                            <span class="text-[11px] ${isPaid ? 'text-emerald-600' : 'text-amber-600'} font-bold">${paidDate}</span>
                        </div>
                    </div>

                    ${renderNoteSection(record)}

                    <!-- Proof Images -->
                    <div class="space-y-4">
                        ${receiptUrl ? `
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                    <span>📸 รูปรายการที่ลานไม้</span>
                                </label>
                                <img src="${receiptUrl}" class="image-aspect rounded-2xl shadow-sm border border-gray-100" onclick="openModal('${receiptUrl}')">
                            </div>
                        ` : ''}

                        ${slipUrl ? `
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                    <span>🧾 สลิปการโอนเงิน</span>
                                </label>
                                <img src="${slipUrl}" class="image-aspect rounded-2xl shadow-sm border border-gray-100" onclick="openModal('${slipUrl}')">
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            resultContainer.classList.remove('hidden');
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Modal Logic
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        const closeModal = document.getElementById('close-modal');

        function openModal(src) {
            modalImg.src = src;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeImageViewer() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
            setTimeout(() => { modalImg.src = ''; }, 300);
        }

        closeModal.onclick = closeImageViewer;
        modal.onclick = (e) => {
            if (e.target === modal || e.target.id === 'modal-img') return;
            closeImageViewer();
        };

        // ฟังก์ชันสั่งค้นหาอัตโนมัติทันที
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id') || urlParams.get('tracking');
            if (idParam) {
                const searchTask = () => {
                    const field = document.getElementById('tracking-id');
                    if (field) {
                        field.value = idParam.trim().toUpperCase();
                        performSearch();
                    } else {
                        setTimeout(searchTask, 100);
                    }
                };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', searchTask);
                } else {
                    searchTask();
                }
            }
        })();
    </script>
</body>

</html>
